name: Bug
description: Report incorrect behavior with a reproducible case.
title: "[bug] "
labels: [bug, needs-spec]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the expected behavior and who is affected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, input, version and actual result. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance scenarios
      description: Give three to five checks for the fix and its regression cases.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: State what this fix must not change. AGENTS.md rules always apply; do not repeat them.
    validations:
      required: true
