name: Idea
description: Propose a change before writing a spec. Use the tracking form for multi-task proposals.
title: "[idea] "
labels: [idea, needs-spec, task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Who needs this change, and what outcome do they need?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance scenarios
      description: Give three to five concrete checks with inputs, outputs and failure cases. Split larger work.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Spec and prerequisites
      description: Optional during planning. Before build approval, use a full spec file URL and an optional spec PR URL.
      placeholder: |
        Spec: https://github.com/OWNER/REPO/blob/DEFAULT_BRANCH/docs/specs/NAME.md
        Spec PR: https://github.com/OWNER/REPO/pull/NUMBER
        Prerequisites:
    validations:
      required: false
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: State exclusions specific to this change. AGENTS.md rules always apply; do not repeat them.
    validations:
      required: true
