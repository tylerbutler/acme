name: Idea
description: Propose a change before writing a spec.
title: "[idea] "
labels: [idea, needs-spec]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Who needs this change, and what outcome do they need?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance scenarios
      description: Give concrete inputs, expected outputs and failure cases.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: State what this change must not include.
    validations:
      required: true
